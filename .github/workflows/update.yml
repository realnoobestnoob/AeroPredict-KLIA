name: Weekly model update

on:
  schedule:
    - cron: "30 20 * * 1"     # weekly trigger
  workflow_dispatch: {}       # manual trigger from GitHub Actions UI

concurrency:
  group: update-model
  cancel-in-progress: false   # never cancel a mid-run training job

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install dependencies
        run: pip install -r requirements-train.txt

      - name: Run incremental update
        run: python -m klia.jobs.update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
