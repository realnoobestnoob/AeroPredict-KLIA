data:
  table: departures
  delay_threshold_minutes: 15
  batch_size: 20000
features:
  prior_strength: 10
  ewm_span: 30
  route_windows_days:
  - 7
  - 30
  default_flights_per_hour: 4.0
  peak_hours:
  - 6
  - 7
  - 8
  - 17
  - 18
  - 19
  - 20
  red_eye_hours:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 22
  - 23
  public_holidays:
  - '2026-01-01'
  - '2026-01-29'
  - '2026-01-30'
  - '2026-02-01'
  - '2026-03-28'
  - '2026-03-29'
  - '2026-04-28'
  - '2026-05-01'
  - '2026-05-12'
  - '2026-06-01'
  - '2026-08-31'
  - '2026-09-16'
  - '2026-10-20'
  - '2026-12-25'
feature_selection:
  enabled: true
  top_k: 18
  probe_rows: 5000
model:
  name: rsub_xgb
  params:
    n_estimators: 6
    subspace_frac: 0.83
    eta: 0.0141
    max_depth: 7
    subsample: 0.86
    colsample_bytree: 0.74
    min_child_weight: 3
  boosting_n_iter: 10
  warmup_rows: 500
  calibration_window: 5000
  decision_threshold: 0.35
eda:
  subset_fraction: 0.25
  batch_size: 500
  n_optuna_trials: 30
registry:
  keep_bundles: 3
  max_mb_neon: 400
api:
  refresh_seconds: 1800
  timezone: Asia/Kuala_Lumpur
monitoring:
  drift_reference_rows: 1000
  drift_log_max: 100
  drift_min_batch: 50
gate:
  enabled: true         # set to true to activate promotion gate on each non-bootstrap run
  sample_rows: 10000     # max new rows fetched per gate run (train + val combined)
  val_fraction: 0.20     # fraction of fetched rows held out chronologically for evaluation
  min_val_rows: 200      # gate is bypassed if clean val rows fall below this
  metric_tolerance: 0  # max allowed AUC or F1 drop (0 = no regression permitted)
tuning:
  sample_rows: 15000
  cv_folds: 3
  batch_size: 500
  gap_penalty: 0.3
  top_k_min: 12
  top_k_max: 21
  eta_min: 0.01
  eta_max: 0.3
  max_depth_min: 3
  max_depth_max: 7
  subsample_min: 0.6
  subsample_max: 1.0
  colsample_min: 0.5
  colsample_max: 1.0
  min_child_weight_min: 1
  min_child_weight_max: 20
  n_iter_min: 10
  n_iter_max: 50
  n_estimators_min: 3
  n_estimators_max: 10
  subspace_frac_min: 0.5
  subspace_frac_max: 0.95
